[package]
name = "kora-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kora security core: shell filter, path policy, regex guard, SSRF guard and sandbox policy (Rust port of electron/lib/* and src/lib/path-security.ts)"

[dependencies]
regex.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true

# NOTE: no platform APIs here. The crate is `#![forbid(unsafe_code)]` and stays pure
# so its logic can be tested identically on any host. The Windows Job Object that
# enforces `kora_security::sandbox` lives in `kora-sandbox`, which owns the `unsafe`.

[dev-dependencies]
tempfile.workspace = true